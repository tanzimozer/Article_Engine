# Article Engine settings.
# Every value here is a locked decision from SPEC.md. Change SPEC.md first.

pipeline:
  # Events starting within this many days are candidates.
  event_window_days: 10
  event_window_min_days: 7

  # Articles processed per run. Leftovers requeue for the next run.
  #
  # Measured 2026-08-20 on the first real article: 30 minutes for a single
  # attempt (write 7.6, fact-check 16.7 across 3 loops, judges 4.4). A revision
  # re-runs write, fact-check and judges, so worst case is roughly 90 minutes
  # per article. The old value of 5 predated any run and could not fit.
  #
  # Minutes are no longer the constraint -- the repo is public, so Actions is
  # unlimited. What binds now is the 6-hour job ceiling and the Max quota the
  # role calls draw on, at a dozen-plus calls per article.
  max_articles_per_run: 3

  # Hard stop, in seconds. Sits comfortably under the job's timeout-minutes so
  # the run always exits in time to commit state -- an uncommitted run loses
  # its work and skips the keep-alive.
  run_timeout_seconds: 13200

  # One article at a time through stages 3-9.
  concurrency: 1

thresholds:
  # Relevance Scorer: mean of category_fit, audience_fit, timeliness.
  relevance_pass_average: 7.0

  # Per-dimension scoring anchor. Each judge is told this is the passing mark,
  # which keeps scores on a stable scale, but it is no longer the gate.
  judge_pass_score: 8

  # The gate. Calibrated 2026-08-21 against the shipped reference article in
  # tanzimozer/Current-Article-Engine, which is human-written, fact-checked and
  # published. Under the old rule -- all seven dimensions at 8 or above -- that
  # article scored 1/7: voice 7, structural 8, editorial 7, factual 4, local 6,
  # ai_pattern 5, seo 7. Our own generated draft scored 3/7 on the same panel.
  #
  # A gate that a professionally published piece fails, and machine output
  # beats, is measuring the wrong thing. The judges' reasoning was sound; the
  # all-seven-at-8 rule was not. Real editing accepts strength across most
  # dimensions with no catastrophic weakness, which is what these two numbers
  # encode.
  #
  # 6.5 and 5 are derived, not chosen: the reference scores a 6.67 mean with a
  # minimum of 5 once factual_venue_integrity is set aside (it scored 4 only
  # because the calibration harness had to invent a research trail; a real run
  # scored that dimension 9).
  judge_pass_average: 6.5
  judge_floor_score: 5

  # Rewrites triggered by a failing gate (judges, or a draft that misses its
  # word or section band). Each one re-runs the writer and the whole fact-check
  # sequence, so it costs 25+ minutes. Three is deliberate.
  max_revise_attempts: 3

  # Fact-check loops within a single draft. A loop is 4-5 minutes and purely
  # mechanical -- it removes claims it cannot verify and re-reads. This used to
  # share the limit above, which held a publishable article one loop short:
  # changes per loop ran 3, then +4, then +1, plainly converging when it hit
  # the cap. The two operations differ by 5x in cost and should not share a
  # budget.
  max_factcheck_loops: 5

  # How many times an article may bounce back to the human before it is archived.
  max_reholds: 2

  # Infrastructure failures are a separate class from content failures.
  infra_retry_attempts: 3
  infra_retry_backoff_seconds: 5

article:
  word_count_min: 800
  word_count_max: 1200
  sections_min: 5
  sections_max: 6
  meta_title_max: 60
  meta_title_suffix: " | Seattle Fitness Mag"
  meta_description_max: 155
  internal_links_min: 1
  internal_links_max: 2

  # Fields in the details box, in render order.
  # `register` is omitted entirely when the event has no registration page.
  details_box_fields:
    - when
    - where
    - cost
    - register
    - skill_level
    - what_to_bring

  # "before you go" was second person, which the house handbook bans outright.
  # It sat in config rather than in a prompt, so the writer never wrote it, the
  # fact-checker does not police tone, and it shipped on the end of every
  # article until the stage 4b voice pass flagged it.
  disclaimer: >-
    Event details can change. Confirm with the organizer before race day.

scheduling:
  # Slot Scheduler targets this many days ahead of the event.
  lead_days_min: 5
  lead_days_max: 7

  # Events closer than this are dropped rather than left to starve in the queue.
  drop_if_lead_days_below: 2

  timezone: America/Los_Angeles

wix:
  site_id: "25296528-c352-482d-9b5b-e143b426d2cd"
  api_base: "https://www.wixapis.com"

  # Live category IDs on seattlefitnessmag.com.
  categories:
    the_guide: "8c5800da-74bb-4924-9b17-8f4d042f25b6"
    training: "2126a2c5-70cb-49d8-acd6-b46709a1043e"
    culture: "6d28fb40-1d6a-4ff6-a9aa-45a54325105f"

  # Never write to these. Guardrail is enforced in code, not just documented.
  forbidden_site_ids:
    - "f916c8b1-134a-4691-9241-5a14bf849078"  # timbr.fit
    - "ab465896-e5c3-4f5d-bc9d-7f495a6d6be1"  # TIMBR-3, product site

skills:
  # Read at run time rather than forked, so a voice fix propagates everywhere.
  repo: "https://github.com/tanzimozer/Skill-Cabinet"
  house_voice: "skills/timbr/magazine-eic/references/house.md"
  eic_harness: "skills/timbr/magazine-eic/SKILL.md"
  rubric: "timbr_eval_v2/RUBRIC.md"
  hardgate: "timbr_eval_v2/hardgate.py"

judges:
  # Six inherited from RUBRIC.md, plus seo, added because the inherited
  # rubric has no SEO dimension. All seven must pass.
  - voice_brand_compliance
  - structural_format_compliance
  - editorial_value
  - factual_venue_integrity
  - seattle_local_specificity
  - ai_pattern_detection
  - seo

notify:
  # Notify on every publish and on every hold or failure.
  email_to: "timbr.tools@gmail.com"
  on_publish: true
  on_hold: true
  on_infra_failure: true

drive:
  # Human-facing artifacts. Two-way for the hold queue only; everything
  # else is a one-way mirror.
  hold_queue_folder: "Article_Engine/holds"
  archive_folder: "Article_Engine/archive"
  reports_folder: "Article_Engine/reports"
  approval_status_line: "STATUS:"
  approved_value: "APPROVED"
